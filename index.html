<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bodin Waste Classifier AI (Kiosk Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    
    <style>
        :root {
            --recycle-color: #f1c40f;
            --general-color: #2980b9;
            --organic-color: #27ae60;
            --hazardous-color: #c0392b;
            --bodin-blue: #1e3a8a;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #1f2937;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--bodin-blue);
            color: white;
            width: 100%;
            text-align: center;
            padding: 24px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        header h1 { margin: 0; font-size: 26px; font-weight: 700; }
        header p { margin: 6px 0 0 0; font-size: 15px; opacity: 0.85; }

        .container {
            max-width: 768px; /* ขนาดกว้างพอดีสำหรับ iPad */
            width: 92%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 25px 0;
            padding-bottom: 80px; /* เว้นพื้นที่ด้านล่างไม่ให้บังปุ่มตั้งค่า */
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            text-align: center;
        }

        .url-input {
            width: 100%; padding: 14px; border: 1.5px solid #e5e7eb;
            border-radius: 12px; box-sizing: border-box; font-size: 16px;
            text-align: center; margin-bottom: 12px; background-color: #f9fafb;
        }

        .btn {
            background-color: var(--bodin-blue); color: white; border: none;
            padding: 14px 28px; border-radius: 14px; cursor: pointer;
            font-size: 16px; font-weight: 600; transition: all 0.2s ease;
            -webkit-appearance: none;
        }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-danger { background-color: #ef4444; }

        /* ส่วนควบคุมกล้อง */
        .webcam-box {
            position: relative; width: 100%; max-width: 440px; aspect-ratio: 4/3;
            background-color: #111827; border-radius: 20px; margin: 0 auto 15px auto;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            border: 4px solid #e5e7eb;
        }
        #webcam-container, #webcam-container canvas, #webcam-container video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover; 
            border-radius: 16px;
        }
        .webcam-placeholder { color: #9ca3af; font-size: 16px; position: absolute; z-index: 1; }

        .camera-control { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; margin-top: 10px; }
        .switch-label { font-size: 18px; font-weight: 600; color: #4b5563; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #34d399; }
        input:checked + .slider:before { transform: translateX(26px); }

        /* ปุ่มกดชัตเตอร์สแกนภาพ */
        .scan-trigger-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; padding: 16px 40px; border-radius: 16px;
            font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; max-width: 440px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); display: none; transition: all 0.2s;
        }
        .scan-trigger-btn:active { transform: scale(0.97); }

        /* การ์ดแจ้งเตือนผลลัพธ์สีเตือน */
        .result-card { padding: 24px; border-radius: 20px; color: white; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.1); animation: zoomIn 0.3s ease; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .result-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .result-details { font-size: 18px; margin-bottom: 15px; opacity: 0.95; }

        /* รูปถังขยะ CSS */
        .bin-container { display: inline-block; width: 90px; height: 110px; position: relative; border-radius: 10px 10px 14px 14px; margin: 10px auto; border: 4px solid rgba(255, 255, 255, 0.9); }
        .bin-lid { width: 102px; height: 14px; background: rgba(255, 255, 255, 0.9); position: absolute; top: -16px; left: -10px; border-radius: 6px; }
        .bin-handle { width: 34px; height: 8px; border: 3px solid rgba(255, 255, 255, 0.9); border-bottom: none; position: absolute; top: -24px; left: 25px; border-radius: 4px 4px 0 0; }
        .bin-icon-text { color: white; font-weight: bold; font-size: 14px; margin-top: 40px; }

        .bg-recycle { background-color: var(--recycle-color); color: #1e293b !important; }
        .bg-recycle .bin-container { background-color: var(--recycle-color); border-color: #1e293b; }
        .bg-recycle .bin-lid, .bg-recycle .bin-handle { background: #1e293b; }
        .bg-recycle .bin-handle { border-color: #1e293b; background: transparent; }
        .bg-recycle .bin-icon-text { color: #1e293b; }
        .bg-general { background-color: var(--general-color); }
        .bg-general .bin-container { background-color: var(--general-color); }
        .bg-organic { background-color: var(--organic-color); }
        .bg-organic .bin-container { background-color: var(--organic-color); }
        .bg-hazardous { background-color: var(--hazardous-color); }
        .bg-hazardous .bin-container { background-color: var(--hazardous-color); }

        /* ส่วนแสดงเมนูสถิติรายบุคคล */
        .search-box-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input { flex: 1; padding: 12px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; font-weight: 600; text-align: center; }
        .search-input:focus { border-color: var(--bodin-blue); outline: none; }
